<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11150f">
  <title>ReserveKit — VELQUIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Outfit:wght@600;700;800" rel="stylesheet">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="app loop-brand">
    <aside class="side">
      <div class="brand">ReserveKit<small data-i18n="sub">Booking CRM</small></div>
      <button class="nav-btn active" data-view="calendar" data-i18n="nav1">Calendar</button>
      <button class="nav-btn" data-view="customers" data-i18n="nav2">Customers</button>
      <button class="nav-btn" data-view="campaigns" data-i18n="nav3">Revisit</button>
      <div class="side-foot"><span data-i18n="foot2">Demo · local AI</span></div>
    </aside>
    <main class="main">
      <div class="workspace-banner">
        <div><span class="status-dot"></span><strong>VELQUIA</strong> · standalone workspace</div>
        <span class="badge ok">Local live</span>
      </div>
      <div class="top">
        <div>
          <h1 data-i18n="title">予約・顧客管理</h1>
          <p data-i18n="lead">店舗向けの予約枠・顧客台帳・再来店リマインド。</p></div></div>
      <section id="view-calendar" class="grid grid-2">
        <div class="card">
          <h2 data-i18n="h_new">New booking</h2>
          <label data-i18n="l_name">Customer</label><input id="cname" placeholder="佐藤">
          <label data-i18n="l_when">Date & time</label><input id="when" type="datetime-local">
          <label data-i18n="l_menu">Menu</label><select id="menu"><option>カット</option><option>カウンセリング</option><option>体験レッスン</option><option>整体60分</option></select>
          <button class="primary" id="book" type="button" data-i18n="btn_book">Confirm</button>
        </div>
        <div class="card"><h2 data-i18n="h_up">Upcoming</h2><ul class="list" id="upcoming"></ul></div>
      </section>
      <section id="view-customers" class="card hidden"><h2 data-i18n="h_cust">Customers</h2><ul class="list" id="custs"></ul></section>
      <section id="view-campaigns" class="card hidden">
        <h2 data-i18n="h_camp">Revisit campaign</h2>
        <p class="muted"><span data-i18n="camp">Build reminder copy for customers idle 30+ days.</span></p>
        <button class="primary" id="remind" type="button" data-i18n="btn_rem">Find targets</button>
        <ul class="list" id="remindList" style="margin-top:12px"></ul>
      </section>
    </main>
  </div>
  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
  <script src="app-kit.js"></script>
  <script src="features.js"></script>
</body>
</html>
