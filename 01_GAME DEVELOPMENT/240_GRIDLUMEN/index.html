<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1faee">
  <title>GRIDLUMEN — VELQUIA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%230c0c0e' width='32' height='32'/><circle cx='12' cy='16' r='6' fill='%23e8d48a'/><circle cx='20' cy='16' r='6' fill='%2306d6a0' opacity='.85'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="wash"></div>
    <div class="grain"></div>
  </div>

  <main class="shell">
    <header class="brand">
      <p class="eyebrow">VELQUIA · merge</p>
      <h1>GRIDLUMEN</h1>
      <p class="lead">同じ数を合成して倍化。にじみ連鎖でボーナス。</p>
    </header>

    <section class="stage">
      <canvas id="board" width="520" height="520" aria-label="GRIDLUMEN"></canvas>
      <p id="status" class="status" role="status">はじめるで墨を落とす。矢印キーまたはスワイプで合成。</p>
    </section>

    <aside class="panel">
      <div class="stat-grid">
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Best</span><strong id="best">0</strong></div>
        <div class="stat"><span>Max</span><strong id="max-tile">2</strong></div>
        <div class="stat"><span>Bleed</span><strong id="bleed">0</strong></div>
      </div>
      <div class="meter">
        <span>Ink pressure</span>
        <div class="meter-track"><i id="pressure"></i></div>
      </div>
      <div class="actions">
        <button type="button" id="btn-start" class="primary">はじめる</button>
        <button type="button" id="btn-undo" class="ghost" disabled>一手戻す <em id="undo-left">1</em></button>
      </div>
      <ul class="keys">
        <li><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd><span>墨を流す</span></li>
        <li><kbd>U</kbd><span>Undo（1回）</span></li>
        <li><kbd>R</kbd><span>リセット</span></li>
      </ul>
      <ul class="rules">
        <li>同じ数字がぶつかると倍になる</li>
        <li>合成直後、隣の同値がにじむと追加得点</li>
        <li>圧力が満タンで「濃墨」タイルが降る</li>
        <li>2048 で傑作クリア</li>
      </ul>
    </aside>
  </main>

  <script src="game.js"></script>
</body>
</html>
