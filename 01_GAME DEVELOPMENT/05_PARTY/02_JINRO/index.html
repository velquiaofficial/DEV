<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>月下の人狼</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230e1424' width='32' height='32'/%3E%3Cpath fill='%23f0d48a' d='M20 6a10 10 0 1 0 6 16 8 8 0 1 1-6-16z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-mood="night">
  <div id="scene" aria-hidden="true">
    <div class="sky"></div>
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="hill hill-back"></div>
    <div class="hill hill-front"></div>
    <div class="trees">
      <i class="t1"></i><i class="t2"></i><i class="t3"></i><i class="t4"></i>
    </div>
    <div class="houses">
      <div class="house h1"><i></i><i></i></div>
      <div class="house h2"><i></i></div>
      <div class="house h3"><i></i><i></i></div>
      <div class="house h4"><i></i></div>
    </div>
    <div class="well"></div>
    <div class="gallows"></div>
    <div class="fog"></div>
  </div>
  <header class="chrome">
    <div id="hud"></div>
    <div class="chrome-actions">
      <button type="button" id="btn-sound" data-act="sound">音: 切</button>
      <button type="button" data-act="rules">掟</button>
    </div>
  </header>
  <main id="app"></main>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
