<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15120f">
  <title>VaultNote — VELQUIA</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="app loop-brand">
    <aside class="side">
      <div class="brand">VaultNote<small data-i18n="sub">Knowledge Base</small></div>
      <button class="nav-btn active" data-view="library" data-i18n="nav_library">Library</button>
      <button class="nav-btn" data-view="editor" data-i18n="nav_editor">Editor</button>
      <button class="nav-btn" data-view="faq" data-i18n="nav_faq">FAQ gen</button>
      <div class="side-foot">
        <span data-i18n="foot2">Standalone · local demo</span>
      </div>
    </aside>
    <main class="main">
      <div class="workspace-banner">
        <div><span class="status-dot"></span><strong>VaultNote</strong> · <span data-i18n="banner">VELQUIA workspace</span></div>
        <span class="badge ok" data-i18n="live">Local live</span>
      </div>
      <div class="top">
        <div>
          <h1 data-i18n="title">Internal wiki</h1>
          <p data-i18n="lead">Organize SOPs, search articles, and generate FAQ drafts.</p>
        </div>
        <div class="top-actions">
          <button type="button" class="primary" id="btn-primary" data-i18n="btn_primary">Run AI</button>
          <button type="button" id="btn-seed" data-i18n="btn_seed">Seed demo</button>
        </div>
      </div>
      <section id="view-library" class="section-enter"></section>
      <section id="view-editor" class="section-enter hidden"></section>
      <section id="view-faq" class="section-enter hidden"></section>
    </main>
  </div>
  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <script src="ai.js"></script>
  <script src="app-kit.js"></script>
  <script src="app.js"></script>
  <script src="features.js"></script>
</body>
</html>
