<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141018">
  <title>CROWNSTACK — VELQUIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Tabletop trial · deck build</p>
      <h1>CROWNSTACK</h1>
      <p class="lead">山札を回して購入力を積み、市場から強いカードを買い、勝利点カードで王権を競う。オリジナル作品です。</p>
    </header>
    <div class="bar">
      <div>You VP <strong id="vp-you">0</strong></div>
      <div>AI VP <strong id="vp-ai">0</strong></div>
      <div>金 <strong id="coin">0</strong> · 購入 <strong id="buys">1</strong></div>
      <button id="btn-start" type="button">はじめる</button>
      <button id="btn-end" type="button" disabled>ターン終了</button>
    </div>
    <p id="status" class="status">はじめるを押してください</p>
    <h2>市場</h2>
    <div id="market" class="cards"></div>
    <h2>手札（クリックでプレイ）</h2>
    <div id="hand" class="cards"></div>
    <p class="meta">山札 <span id="deckn">0</span> · 捨て札 <span id="disc">0</span></p>
  </main>
  <script src="game.js"></script>
</body>
</html>
