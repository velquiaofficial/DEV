<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e151c">
  <title>RAILSPAN — VELQUIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Tabletop trial · route claim</p>
      <h1>RAILSPAN</h1>
      <p class="lead">列車カードで都市間ルートを確保し、目的地チケットを達成して高得点を狙う。オリジナル作品です。</p>
    </header>
    <div class="bar">
      <div>You <strong id="pts-you">0</strong></div>
      <div>AI <strong id="pts-ai">0</strong></div>
      <div>列車 <strong id="trains">20</strong></div>
      <button id="btn-start" type="button">はじめる</button>
      <button id="btn-end" type="button" disabled>採点して終了</button>
    </div>
    <p id="status" class="status">はじめるを押してください</p>
    <canvas id="map" width="640" height="380"></canvas>
    <section class="row">
      <div>
        <h2>手札</h2>
        <div id="hand" class="hand"></div>
        <button id="btn-draw" type="button" disabled>山札から2枚</button>
      </div>
      <div>
        <h2>目的地</h2>
        <ul id="tickets"></ul>
        <h2>表向きカード</h2>
        <div id="face" class="hand"></div>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
