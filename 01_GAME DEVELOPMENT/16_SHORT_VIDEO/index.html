<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14150f">
  <title>ClipForge — VELQUIA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23120e0a' width='32' height='32'/><rect x='6' y='8' width='20' height='16' rx='2' fill='none' stroke='%23e8b84a' stroke-width='2'/><circle cx='12' cy='16' r='2' fill='%23e07a5f'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="app loop-brand clip-app">
    <aside class="side">
      <div class="brand">
        ClipForge
        <small data-i18n="sub">AIショート動画</small>
      </div>
      <button class="nav-btn active" type="button" data-view="script" data-i18n="nav1">台本</button>
      <button class="nav-btn" type="button" data-view="timeline" data-i18n="nav2">タイムライン</button>
      <button class="nav-btn" type="button" data-view="export" data-i18n="nav3">書き出し</button>
      <div class="side-foot">
        <span data-i18n="foot2">デモ · ローカル完結</span>
        <span class="port-hint">:5616</span>
      </div>
    </aside>

    <main class="main">
      <div class="workspace-banner">
        <div><span class="status-dot"></span><strong>VELQUIA</strong> · ClipForge 単独ワークスペース</div>
        <span class="badge ok">Local</span>
      </div>

      <div class="top">
        <div>
          <h1 data-i18n="title">最初の3秒を、設計する</h1>
          <p data-i18n="lead">Shorts / TikTok / Reels 向けに台本・シーン・フック・テロップを組み立てます。</p>
        </div>
      </div>

      <section id="view-script" class="grid grid-2">
        <div class="card">
          <h2 data-i18n="h_brief">ブリーフ</h2>
          <label data-i18n="l_topic">テーマ</label>
          <input id="topic" data-i18n-placeholder="ph_topic" placeholder="新作ゲームの30秒ティーザー">
          <label data-i18n="l_dur">尺（秒）</label>
          <select id="dur">
            <option value="15">15</option>
            <option value="30" selected>30</option>
            <option value="60">60</option>
          </select>
          <label data-i18n="l_style">スタイル</label>
          <select id="style">
            <option value="Cinematic">シネマティック</option>
            <option value="UGC">UGC</option>
            <option value="Promo">プロモ</option>
          </select>
          <button class="primary" id="gen" type="button" data-i18n="btn_gen">台本を生成</button>
        </div>
        <div class="card">
          <h2 data-i18n="h_script">台本</h2>
          <div id="scriptOut" class="preview" data-i18n="prev">生成結果がここに表示されます</div>
        </div>
      </section>

      <section id="view-timeline" class="card hidden">
        <h2 data-i18n="h_tl">シーンタイムライン</h2>
        <ul class="list" id="scenes"></ul>
      </section>

      <section id="view-export" class="card hidden">
        <h2 data-i18n="h_ex">書き出し</h2>
        <p class="muted"><span data-i18n="ex">デモは台本とシーン設計まで。本番の動画APIは原価管理が必要です。</span></p>
        <div class="actions">
          <button class="primary" id="copy" type="button" data-i18n="btn_copy">台本をコピー</button>
        </div>
      </section>
    </main>
  </div>

  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
  <script src="app-kit.js"></script>
  <script src="features.js"></script>
</body>
</html>
