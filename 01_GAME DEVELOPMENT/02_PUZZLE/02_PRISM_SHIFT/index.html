<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1620">
  <title>Prism Shift — VELQUIA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%230a1620' width='32' height='32'/><path fill='%23e8b84a' d='M6 16h20M16 6v20'/><circle cx='16' cy='16' r='4' fill='%2378c4b8'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="haze"></div>
    <div class="grain"></div>
  </div>

  <main class="shell">
    <header class="brand">
      <p class="eyebrow">VELQUIA · Puzzle</p>
      <h1>Prism Shift</h1>
      <p class="lead" id="lead">鏡とプリズムを回し、光をすべての受け皿へ届ける。</p>
    </header>

    <section class="stage">
      <canvas id="board" width="480" height="480" aria-label="光の盤面"></canvas>
      <div class="hud">
        <div class="stat">
          <span>Stage</span>
          <strong id="stage-label">1 / 8</strong>
        </div>
        <div class="stat">
          <span>Moves</span>
          <strong id="moves">0</strong>
        </div>
        <div class="stat">
          <span>Lit</span>
          <strong id="lit">0 / 0</strong>
        </div>
      </div>
    </section>

    <aside class="panel">
      <p id="status" class="status" role="status">セルをタップして回転。光が通る経路は自動で更新されます。</p>
      <div class="actions">
        <button type="button" id="btn-reset" class="ghost">このステージをリセット</button>
        <button type="button" id="btn-next" class="primary" disabled>次のステージ</button>
      </div>
      <ul class="legend">
        <li><i class="ico emit"></i><span>光源 — 固定</span></li>
        <li><i class="ico mirror"></i><span>鏡 — 90°反射（クリックで回転）</span></li>
        <li><i class="ico prism"></i><span>プリズム — 直進＋直角分岐</span></li>
        <li><i class="ico sink"></i><span>受け皿 — すべて点灯でクリア</span></li>
        <li><i class="ico wall"></i><span>壁 — 光を止める</span></li>
      </ul>
      <p class="hint">ヒント: プリズムは「分岐」を作る。余った枝が壁に当たっても構わない。</p>
    </aside>
  </main>

  <script src="game.js"></script>
</body>
</html>
