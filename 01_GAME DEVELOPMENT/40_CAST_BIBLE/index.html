<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15130f">
  <title>CastBible — VELQUIA</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="app loop-brand">
    <aside class="side">
      <div class="brand">CastBible<small data-i18n="sub">From RELIXIA cast craft</small></div>
      <p class="nav-label" data-i18n="based_label">Based on</p>
      <p class="mini" style="padding:0 10px 10px;margin:0" data-i18n="based">01_PROJECT / RELIXIA — FROZEN eTerNITY</p>
      <button class="nav-btn active" data-view="roster" data-i18n="nav_roster">Roster</button>
      <button class="nav-btn" data-view="civ" data-i18n="nav_civ">Civilizations</button>
      <button class="nav-btn" data-view="export" data-i18n="nav_export">Export</button>
      <div class="side-foot">
        <span data-i18n="foot2">Standalone</span>
      </div>
    </aside>
    <main class="main">
      <div class="workspace-banner">
        <div><span class="status-dot"></span><strong>CastBible</strong> · <span data-i18n="banner">Studio tool</span></div>
        <span class="badge ok" data-i18n="live">Local live</span>
      </div>
      <div class="top">
        <div>
          <h1 data-i18n="title">Civilization cast bible</h1>
          <p data-i18n="lead">Roster mythic casts by civilization — inspired by Relixia character craft (does not edit Relixia files).</p>
        </div>
        <div class="top-actions">
          <button type="button" class="primary" id="btn-primary" data-i18n="btn_primary">Run AI</button>
          <button type="button" id="btn-seed" data-i18n="btn_seed">Seed from games</button>
        </div>
      </div>
      <section id="view-roster" class="section-enter"></section>
      <section id="view-civ" class="section-enter hidden"></section>
      <section id="view-export" class="section-enter hidden"></section>
    </main>
  </div>
  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <script src="ai.js"></script>
  <script src="app-kit.js"></script>
  <script src="app.js"></script>
  <script src="features.js"></script>
</body>
</html>
