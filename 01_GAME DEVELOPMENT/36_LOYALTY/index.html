<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15110f">
  <title>GlowCard — VELQUIA</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="app loop-brand">
    <aside class="side">
      <div class="brand">GlowCard<small data-i18n="sub">Loyalty CRM</small></div>
      <button class="nav-btn active" data-view="members" data-i18n="nav_members">Members</button>
      <button class="nav-btn" data-view="tiers" data-i18n="nav_tiers">Tiers</button>
      <button class="nav-btn" data-view="campaigns" data-i18n="nav_campaigns">Campaigns</button>
      <div class="side-foot">
        <span data-i18n="foot2">Standalone · local demo</span>
      </div>
    </aside>
    <main class="main">
      <div class="workspace-banner">
        <div><span class="status-dot"></span><strong>GlowCard</strong> · <span data-i18n="banner">VELQUIA workspace</span></div>
        <span class="badge ok" data-i18n="live">Local live</span>
      </div>
      <div class="top">
        <div>
          <h1 data-i18n="title">Points & tiers</h1>
          <p data-i18n="lead">Manage members, tiers, and campaign rewards.</p>
        </div>
        <div class="top-actions">
          <button type="button" class="primary" id="btn-primary" data-i18n="btn_primary">Run AI</button>
          <button type="button" id="btn-seed" data-i18n="btn_seed">Seed demo</button>
        </div>
      </div>
      <section id="view-members" class="section-enter"></section>
      <section id="view-tiers" class="section-enter hidden"></section>
      <section id="view-campaigns" class="section-enter hidden"></section>
    </main>
  </div>
  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <script src="ai.js"></script>
  <script src="app-kit.js"></script>
  <script src="app.js"></script>
  <script src="features.js"></script>
</body>
</html>
