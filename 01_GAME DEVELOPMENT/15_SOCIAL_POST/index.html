<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1515">
  <title>PulsePost — VELQUIA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%230a1210' width='32' height='32'/><circle cx='16' cy='16' r='7' fill='none' stroke='%2378c4b8' stroke-width='2'/><circle cx='16' cy='16' r='2.5' fill='%23e8b84a'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="app loop-brand pulse-app">
    <aside class="side">
      <div class="brand">
        PulsePost
        <small data-i18n="sub">AIソーシャルスタジオ</small>
      </div>
      <button class="nav-btn active" type="button" data-view="compose" data-i18n="nav1">作成</button>
      <button class="nav-btn" type="button" data-view="queue" data-i18n="nav2">キュー</button>
      <button class="nav-btn" type="button" data-view="library" data-i18n="nav3">テンプレ</button>
      <button class="nav-btn" type="button" data-view="analytics" data-i18n="nav4">分析</button>
      <div class="side-foot">
        <span data-i18n="foot2">デモ · ローカル完結</span>
        <span class="port-hint">:5615</span>
      </div>
    </aside>

    <main class="main">
      <div class="workspace-banner">
        <div><span class="status-dot"></span><strong>VELQUIA</strong> · PulsePost 単独ワークスペース</div>
        <span class="badge ok">Local</span>
      </div>

      <div class="top">
        <div>
          <h1 data-i18n="title">投稿を、落ち着いて量産する</h1>
          <p data-i18n="lead">キャプション案・タグ・予約・テンプレ・書き出しまで。このフォルダだけで動きます。</p>
        </div>
        <span class="badge ok" data-i18n="badge">おすすめ</span>
      </div>

      <div class="kpi-row">
        <div class="card"><div class="stat"><span data-i18n="k1">未投稿キュー</span><strong id="k-q">0</strong></div></div>
        <div class="card"><div class="stat"><span data-i18n="k2">生成数</span><strong id="k-g">0</strong></div></div>
        <div class="card"><div class="stat"><span data-i18n="k3">テンプレ</span><strong id="k-t">0</strong></div></div>
        <div class="card"><div class="stat"><span data-i18n="k4">最適時</span><strong id="k-h">--</strong></div></div>
      </div>

      <section id="view-compose" class="grid grid-2">
        <div class="card">
          <h2 data-i18n="h_compose">作成</h2>
          <label data-i18n="l_topic">テーマ</label>
          <textarea id="topic" rows="3" data-i18n-placeholder="ph_topic" placeholder="今週の制作ティーザー"></textarea>
          <div class="row">
            <div>
              <label data-i18n="l_tone">トーン</label>
              <select id="tone">
                <option value="warm">あたたかい JP</option>
                <option value="cool">クール EN</option>
                <option value="sales">セールス</option>
              </select>
            </div>
            <div>
              <label data-i18n="l_ch">チャネル</label>
              <select id="channel">
                <option>X</option>
                <option>Instagram</option>
                <option>Both</option>
              </select>
            </div>
          </div>
          <label data-i18n="l_img">画像プロンプト</label>
          <input id="imgPrompt" data-i18n-placeholder="ph_img" placeholder="シネマティックなキーアート…">
          <label data-i18n="l_when">予約日時</label>
          <input id="when" type="datetime-local">
          <div class="chips" id="presets"></div>
          <div class="actions">
            <button class="primary" id="btn-gen" type="button" data-i18n="btn_gen">3案生成</button>
            <button id="btn-queue" type="button" data-i18n="btn_q">選択をキューへ</button>
            <button id="btn-save-tpl" type="button" data-i18n="btn_tpl">テンプレ保存</button>
          </div>
          <p class="mini" id="limitHint"></p>
        </div>

        <div class="card">
          <h2 data-i18n="h_var">バリエーション</h2>
          <div id="variants" class="list"></div>
          <h2 class="subhead" data-i18n="h_hash">ハッシュタグ</h2>
          <div class="chips" id="hashes"></div>
          <div id="imgBox" class="preview" data-i18n="img_ph">画像プロンプトのプレビュー</div>
        </div>
      </section>

      <section id="view-queue" class="card hidden">
        <div class="toolbar">
          <h2 data-i18n="h_queue">予約キュー</h2>
          <span class="spacer"></span>
          <button id="btn-export-q" type="button" data-i18n="btn_exp">JSON書き出し</button>
          <button id="btn-clear-q" type="button" data-i18n="btn_clr">完了を削除</button>
        </div>
        <table class="table">
          <thead>
            <tr><th>日時</th><th>CH</th><th>本文</th><th></th></tr>
          </thead>
          <tbody id="qbody"></tbody>
        </table>
      </section>

      <section id="view-library" class="card hidden">
        <h2 data-i18n="h_lib">テンプレート</h2>
        <ul class="list" id="tplList"></ul>
      </section>

      <section id="view-analytics" class="hidden">
        <div class="card">
          <h2 data-i18n="h_an">チャネル比率</h2>
          <div id="bars"></div>
          <p class="muted analytics-note" data-i18n="analytics">API準備後、Social Auto と連携予定。</p>
        </div>
      </section>
    </main>
  </div>

  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
  <script src="app-kit.js"></script>
  <script src="features.js"></script>
</body>
</html>
