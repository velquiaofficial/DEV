<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13150f">
  <title>Ledgerly — VELQUIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Outfit:wght@600;700;800" rel="stylesheet">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="app loop-brand">
    <aside class="side">
      <div class="brand">Ledgerly<small data-i18n="sub">Expense AI</small></div>
      <button class="nav-btn active" data-view="add" data-i18n="nav1" data-i18n="btn_add">Add</button>
      <button class="nav-btn" data-view="budget" data-i18n="nav2">Budget</button>
      <button class="nav-btn" data-view="report" data-i18n="nav3">Report</button>
      <div class="side-foot"><span data-i18n="foot2">Demo · local AI</span></div>
    </aside>
    <main class="main">
      <div class="workspace-banner">
        <div><span class="status-dot"></span><strong>VELQUIA</strong> · standalone workspace</div>
        <span class="badge ok">Local live</span>
      </div>
      <div class="top">
        <div>
          <h1 data-i18n="title">家計管理・経費精算</h1>
          <p data-i18n="lead">支出登録・カテゴリ分類・月次レポート（ローカル保存）。</p></div></div>
      <section id="view-add" class="card">
        <div class="row">
          <div><label data-i18n="l_amt">Amount</label><input id="amt" type="number" placeholder="1280"></div>
          <div><label data-i18n="l_cat">Category</label><select id="cat"><option>食費</option><option>交通</option><option>事業経費</option><option>光熱</option><option>その他</option></select></div>
        </div>
        <label data-i18n="l_memo">Memo / receipt</label><input id="memo" placeholder="カフェ、クライアント打合せ">
        <button class="primary" id="add" type="button">追加</button>
        <ul class="list" id="recent" style="margin-top:12px"></ul>
      </section>
      <section id="view-budget" class="card hidden">
        <label data-i18n="l_bud">Monthly budget</label><input id="budget" type="number" value="80000">
        <button id="saveBudget" type="button" data-i18n="btn_bud">Save</button>
        <p class="muted" id="budgetMsg" style="margin-top:12px"></p>
      </section>
      <section id="view-report" class="hidden">
        <div class="grid grid-3"><div class="card"><div class="stat"><span>Month spend</span><strong id="total">¥0</strong></div></div><div class="card"><div class="stat"><span>Remaining</span><strong id="left">¥0</strong></div></div><div class="card"><div class="stat"><span>Top category</span><strong id="top">-</strong></div></div></div>
        <div class="card" style="margin-top:14px"><h2 data-i18n="h_break">Breakdown</h2><ul class="list" id="byCat"></ul></div>
      </section>
    </main>
  </div>
  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
  <script src="app-kit.js"></script>
  <script src="features.js"></script>
</body>
</html>
